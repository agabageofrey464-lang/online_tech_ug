services:
  db:
    image: postgres:16-alpine
    container_name: onlinetech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: onlinetech
      POSTGRES_PASSWORD: onlinetech
      POSTGRES_DB: onlinetech
    ports:
      - "5432:5432"
    volumes:
      - onlinetech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlinetech"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: onlinetech-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://onlinetech:onlinetech@db:5432/onlinetech
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    profiles: ["full"]

volumes:
  onlinetech_pgdata:
