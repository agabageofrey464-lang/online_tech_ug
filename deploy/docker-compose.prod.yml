# Production stack for OnlineTechUg API on the shared VPS.
# Coexists with the existing Beds & Beddings services:
#   - PostgreSQL is NOT published to the host (internal docker network only)
#   - API is published to 127.0.0.1:8000 ONLY, so the host nginx can proxy it
#     without exposing it publicly or clashing with bedsbeddings.
# Run from the deploy/ directory:  docker compose -f docker-compose.prod.yml up -d --build
name: onlinetech

services:
  db:
    image: postgres:16-alpine
    container_name: onlinetech-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - onlinetech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onlinetech

  api:
    build:
      context: ../apps/api
    container_name: onlinetech-api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Overrides .env.prod — talks to the db service over the internal network
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # localhost only; reverse-proxied by the host's existing nginx.
      # Host port is configurable to avoid clashing with other apps on the VPS.
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    networks:
      - onlinetech

volumes:
  onlinetech_pgdata:

networks:
  onlinetech:
    driver: bridge
