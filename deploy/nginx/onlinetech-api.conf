# nginx server block for the OnlineTechUg API.
# Install:  sudo cp onlinetech-api.conf /etc/nginx/sites-available/onlinetech-api
#           sudo ln -s /etc/nginx/sites-available/onlinetech-api /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then enable HTTPS (adds the 443 block + redirect automatically):
#           sudo certbot --nginx -d API_DOMAIN
#
# Replace API_DOMAIN below with the real domain, e.g. api.onlinetech.ug
# This block ONLY responds to API_DOMAIN, so existing bedsbeddings vhosts are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    # Reasonable upload size for future image uploads
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
